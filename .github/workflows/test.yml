name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@08c6903
      - uses: actions/setup-node@2028fbc
        with:
          node-version: lts/*
      - run: npm install
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@08c6903
      - uses: actions/setup-node@2028fbc
        with:
          node-version: lts/*
      - run: npm install -g bare-runtime
      - run: npm install
      - run: npm test
